name: Run CI
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24.21.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libimage-exiftool-perl

      - name: Build
        run: pnpm build

      - name: Check code style
        run: |
          pnpm fmt
          git --no-pager diff --exit-code

      - name: CI tests
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    needs: ci
    name: Docker build and upload
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build -t lusc.ch/initiative-tracker . --progress=plain

      - name: Sync
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts

          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT INT TERM
          printf '%s\n' "$SSH_KEY" | ssh-add -t 1200 -

          SSH_OPTS='ssh -o StrictHostKeyChecking=yes -o BatchMode=yes'

          docker save lusc.ch/initiative-tracker:latest \
            | gzip \
            | $SSH_OPTS "$SSH_USERNAME@$SSH_HOST" "docker load && cd /opt/initiative-tracker/ && docker compose up -d --pull never --remove-orphans"
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
