name: Run CI
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@v24.18.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libimage-exiftool-perl

      - name: Build
        run: pnpm build

      - name: Check code style
        run: |
          pnpm fmt
          git --no-pager diff --exit-code

      - name: CI tests
        run: pnpm test

      - name: Upload build
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: |
            api/dist
            api/package.json
            backend/dist
            backend/package.json
            frontend/dist
            frontend/package.json
            util/dist
            util/package.json
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
          include-hidden-files: true
          if-no-files-found: error

  upload:
    runs-on: ubuntu-latest
    needs: ci
    name: Upload
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build

      - name: Sync
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts

          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT INT TERM
          printf '%s\n' "$SSH_KEY" | ssh-add -t 1200 -

          SSH_OPTS='ssh -o StrictHostKeyChecking=yes -o BatchMode=yes'

          rsync --verbose --human-readable \
            --recursive --checksum --relative \
            --compress --delete \
            --rsh "$SSH_OPTS" \
            {api,backend,frontend,util}/{dist/,package.json} \
            package.json pnpm-*.yaml \
            "$SSH_USERNAME@$SSH_HOST:/opt/initiative-tracker/"

          $SSH_OPTS "$SSH_USERNAME@$SSH_HOST" /opt/initiative-tracker/post-deploy.sh
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
